/* ---------------- Gerenciamento de Estado ---------------- */
let currentView = "home";
let selectedCourse = null;
let selectedLessonIndex = 0;

let currentStudent = JSON.parse(localStorage.getItem("iml_student") || "null");

/* ---------------- Elementos DOM ---------------- */
const app = document.getElementById("app");
const logoImg = document.getElementById("logo-img");
const mainNav = document.getElementById("main-nav");
const homeBtn = document.getElementById("home-btn");

logoImg.innerHTML = `<img src="${LOGO_SRC}" alt="IML Logo" style="width:100%;height:100%;object-fit:cover;" />`;

homeBtn.addEventListener("click", () => navigate("home"));

/* ---------------- Síntese de Voz ---------------- */
function speak(text, lang) {
  if (!lang || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  window.speechSynthesis.speak(utterance);
}

/* ---------------- Navegação e Renderização ---------------- */
function navigate(view, course = null, lessonIndex = 0) {
  currentView = view;
  if (course) selectedCourse = course;
  selectedLessonIndex = lessonIndex;
  render();
}

function renderNav() {
  mainNav.innerHTML = `
    <button class="link ${currentView==='home'?'active':''}" onclick="navigate('home')">Cursos</button>
    <button class="link ${currentView==='student_login'?'active':''}" onclick="navigate('student_login')">
      ${currentStudent ? 'Área do Aluno' : 'Login Aluno'}
    </button>
    <button class="link ${currentView==='admin_login' || currentView==='admin_dashboard'?'active':''}" onclick="navigate('${isAdminLoggedIn ? 'admin_dashboard' : 'admin_login'}')">
      ${isAdminLoggedIn ? 'Painel Admin' : 'Login Admin'}
    </button>
  `;

  if (currentStudent) {
    studentInfo.style.display = "block";
    studentInfo.innerHTML = `Aluno ativo: <strong>${currentStudent.name}</strong> (${currentStudent.email})`;
  } else {
    studentInfo.style.display = "none";
  }
}

function render() {
  renderNav();
  app.innerHTML = "";

  if (currentView === "home") renderHome();
  else if (currentView === "course") renderCourse();
  else if (currentView === "lesson") renderLesson();
  else if (currentView === "student_login") renderStudentLogin();
  else if (currentView === "admin_login") renderAdminLogin();
  else if (currentView === "admin_dashboard") renderAdminDashboard();
}

/* ---------------- Views ---------------- */

// Home
function renderHome() {
  let html = `

          O <strong>Instituto Maria Luz</strong> é uma plataforma educacional interativa desenvolvida para promover o aprendizado prático e acessível. Oferecemos capacitação em idiomas (Inglês e Espanhol) e inclusão digital (Informática Básica), contando com áudio interativo para treino de pronúncia, exercícios de fixação em tempo real para os alunos e um painel de acompanhamento detalhado para que os educadores monitorem os acertos e o desempenho da turma.

  COURSES.forEach(c => {

// Lição & Exercícios
function renderLesson() {
  if (!selectedCourse) return navigate('home');
  const lesson = selectedCourse.lessons[selectedLessonIndex];

  let html = `
    <div class="section max-w-5xl">
      <button class="btn ghost" onclick="navigate('course', selectedCourse)" style="margin-bottom:16px">← Voltar para ${selectedCourse.name}</button>
      
      <div class="card" style="margin-bottom:24px">
        <span class="small" style="color:${selectedCourse.color}">Lição ${selectedLessonIndex + 1} de ${selectedCourse.lessons.length}</span>
        <h1 style="margin:4px 0 12px 0">${lesson.title}</h1>
        <p style="margin:0;line-height:1.5">${lesson.intro}</p>
      </div>
  `;

  // Vocabulário
  if (lesson.vocab && lesson.vocab.length > 0) {
    html += `
      <h2 style="font-size:18px;margin-bottom:12px">Vocabulário & Pronúncia</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:12px;margin-bottom:32px">
    `;
    lesson.vocab.forEach(v => {
      const clickVoice = selectedCourse.speechLang ? `onclick="speak('${v.term.replace(/'/g, "\\'")}', '${selectedCourse.speechLang}')"` : '';
      html += `
        <div class="card" ${clickVoice} style="${selectedCourse.speechLang ? 'cursor:pointer' : ''}">
          <div style="font-weight:700;color:${selectedCourse.color}">${v.term} ${selectedCourse.speechLang ? '🔊' : ''}</div>
          <div class="small">${v.translation}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // Seção de Exercícios Centralizada mais à esquerda
  if (lesson.quiz && lesson.quiz.length > 0) {
    html += `
      <div class="exercise-container">
        <h2 style="font-size:18px;margin-bottom:16px">Exercícios de Fixação</h2>
        <form id="quiz-form" onsubmit="handleQuizSubmit(event)">
    `;

    lesson.quiz.forEach((q, qIdx) => {
      html += `
        <div class="quiz-card">
          <div style="font-weight:600;margin-bottom:12px">${qIdx + 1}. ${q.q}</div>
          <div>
      `;

      q.options.forEach((opt, oIdx) => {
        html += `
          <label class="option-label">
            <input type="radio" name="q_${qIdx}" value="${oIdx}" required />
            <span>${opt}</span>
          </label>
        `;
      });

      html += `</div></div>`;
    });

    html += `
          <button type="submit" class="btn primary" style="background:${selectedCourse.color};margin-top:8px">Enviar Respostas</button>
        </form>
        <div id="quiz-result" style="margin-top:16px"></div>
      </div>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}

// Submissão do Quiz pelo Aluno
function handleQuizSubmit(e) {
  e.preventDefault();
  const lesson = selectedCourse.lessons[selectedLessonIndex];
  let score = 0;
  let total = lesson.quiz.length;

  lesson.quiz.forEach((q, idx) => {
    const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
    if (selected && parseInt(selected.value) === q.correct) {
      score++;
    }
  });

  const errors = total - score;
  const percent = Math.round((score / total) * 100);

  const resultDiv = document.getElementById("quiz-result");
  resultDiv.innerHTML = `
    <div class="card" style="border-left:4px solid ${percent >= 70 ? 'var(--success)' : 'var(--danger)'}">
      <div style="font-size:16px" class="${percent >= 70 ? 'text-success' : 'text-danger'}">
        Resultado: ${score} acerto(s) e ${errors} erro(s) (${percent}%)
      </div>
      <p style="margin:4px 0 0 0;font-size:14px" class="muted">
        ${percent >= 70 ? 'Excelente! Seu resultado foi registrado.' : 'Revise o conteúdo acima e tente novamente.'}
      </p>
    </div>
  `;

  if (currentStudent) {
    let allResults = JSON.parse(localStorage.getItem("iml_all_results") || "[]");
    
    allResults.push({
      studentName: currentStudent.name,
      studentEmail: currentStudent.email,
      courseName: selectedCourse.name,
      lessonTitle: lesson.title,
      score: score,
      errors: errors,
      total: total,
      percent: percent,
      date: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
    });

    localStorage.setItem("iml_all_results", JSON.stringify(allResults));
  } else {
    alert("Dica: Faça login na Área do Aluno para salvar seu progresso para o professor!");
  }
}

// Tela de Login / Perfil do Aluno
function renderStudentLogin() {
  if (currentStudent) {
    let allResults = JSON.parse(localStorage.getItem("iml_all_results") || "[]");
    let myResults = allResults.filter(r => r.studentEmail === currentStudent.email);

    let html = `

        </div>

        <h2 style="font-size:18px;margin-bottom:12px">Meus Exercícios Realizados</h2>
        <div class="card">
    `;

    if (myResults.length === 0) {
      html += `<p class="muted" style="margin:0">Você ainda não concluiu nenhum exercício enquanto estava logado.</p>`;
    } else {
      html += `
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Curso / Lição</th>
              <th>Acertos</th>
              <th>Erros</th>
              <th>Nota</th>
            </tr>
          </thead>

      `;

        html += `

            <td>${r.date}</td>
            <td><strong>${r.courseName}</strong> - ${r.lessonTitle}</td>

            <td class="${r.percent >= 70 ? 'text-success' : 'text-danger'}">${r.percent}%</td>

      });
      html += `</tbody></table>`;
    }

    html += `</div></div>`;
    app.innerHTML = html;
    return;

  app.innerHTML = `
    <div class="section max-w-5xl" style="max-width:400px">

        <form onsubmit="loginStudent(event)">

            <input type="text" id="std-name" required placeholder="Ex: Maria Silva" />
          </div>
          <div style="margin-bottom:16px">
            <label class="small">Seu E-mail</label>
            <input type="email" id="std-email" required placeholder="aluno@email.com" />
          </div>
          <button type="submit" class="btn primary" style="width:100%">Acessar como Aluno</button>
        </form>
      </div>

function loginStudent(e) {
  e.preventDefault();
  const name = document.getElementById("std-name").value;
  const email = document.getElementById("std-email").value;
  currentStudent = { name, email };
  localStorage.setItem("iml_student", JSON.stringify(currentStudent));
  render();
}

function logoutStudent() {
  currentStudent = null;
  localStorage.removeItem("iml_student");
  render();
}

// Painel do Admin
function renderAdminDashboard() {
  if (!isAdminLoggedIn) return renderAdminLogin();

  let allResults = JSON.parse(localStorage.getItem("iml_all_results") || "[]");

  let html = `
    <div class="section max-w-5xl">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div>
          <h1 style="font-size:22px;margin:0">Painel Administrativo</h1>
          <p class="muted" style="margin:4px 0 0 0">Acompanhamento dos exercícios e taxa de acertos dos alunos</p>
        </div>
        <button class="btn ghost" onclick="logoutAdmin()">Sair do Admin</button>
      </div>

      <div class="grid cols-3" style="margin-bottom:24px">
        <div class="card">
          <div class="small">Total de Exercícios Enviados</div>
          <div style="font-size:24px;font-weight:700">${allResults.length}</div>
        </div>
        <div class="card">
          <div class="small">Cursos Ativos</div>
          <div style="font-size:24px;font-weight:700">${COURSES.length}</div>
        </div>
        <div class="card">
          <div class="small">Status da Plataforma</div>
          <div style="font-size:24px;font-weight:700;color:var(--success)">Ativo</div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:18px;margin:0">Relatório de Exercícios dos Alunos</h2>
          ${allResults.length > 0 ? `<button class="btn danger" style="padding:6px 12px;font-size:12px" onclick="clearResults()">Limpar Histórico</button>` : ''}
        </div>
  `;

  if (allResults.length === 0) {
    html += `<p class="muted" style="margin:0">Nenhum exercício foi resolvido até o momento.</p>`;
  } else {
    html += `
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Aluno</th>
              <th>Curso / Lição</th>
              <th>Acertos</th>
              <th>Erros</th>
              <th>Aproveitamento</th>
            </tr>
          </thead>
          <tbody>
    `;

    allResults.slice().reverse().forEach(r => {
      html += `
        <tr>
          <td><span class="small">${r.date}</span></td>
          <td><strong>${r.studentName}</strong><br><span class="small">${r.studentEmail}</span></td>
          <td>${r.courseName}<br><span class="small">${r.lessonTitle}</span></td>
          <td><span class="text-success">${r.score}</span> / ${r.total}</td>
          <td><span class="text-danger">${r.errors}</span></td>
          <td>
            <span class="${r.percent >= 70 ? 'text-success' : 'text-danger'}">${r.percent}%</span>
          </td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  html += `</div></div>`;
  app.innerHTML = html;
}

function clearResults() {
  if (confirm("Tem certeza que deseja apagar todos os registros de exercícios?")) {
    localStorage.removeItem("iml_all_results");
    render();
  }
}

/* Inicialização */
render();
